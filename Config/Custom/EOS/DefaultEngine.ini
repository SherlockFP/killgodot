; Kill Godot - Epic Online Services profile (player-hosted P2P matches over EOS Lobbies + the EOS P2P relay).
;
; This layer is ONLY loaded when the game runs with -CustomConfig=EOS (development), or when
; Source/KillGodot.Target.cs sets CustomConfig = "EOS" (shipping). Without it the game keeps using
; OnlineSubsystemNull: LAN lobbies + direct IP, nothing online, nothing breaks.
;
; Before using it, fill the +Artifacts line below from your Epic Developer Portal product:
; see Docs/Online_EOS_Setup.md. Never publish the ClientSecret in a public repository.

[OnlineSubsystem]
DefaultPlatformService=EOS

[OnlineSubsystemEOS]
bEnabled=true

[/Script/OnlineSubsystemEOS.EOSSettings]
CacheDir=CacheDir
DefaultArtifactName=KillGodot
; Epic account login (account portal / Epic Games Store / DevAuthTool) + EOS Connect for game services.
bUseEAS=True
bUseEOSConnect=True
bUseEOSRTC=True
bEnableOverlay=True
bEnableSocialOverlay=True
+Artifacts=(ArtifactName="KillGodot",ClientId="",ClientSecret="",ProductId="",SandboxId="",DeploymentId="",ClientEncryptionKey="")

; Game traffic goes through NetDriverEOS (P2P with NAT traversal and relays); IpNetDriver stays the fallback.
[/Script/Engine.GameEngine]
!NetDriverDefinitions=ClearArray
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="/Script/SocketSubsystemEOS.NetDriverEOS",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")
+NetDriverDefinitions=(DefName="BeaconNetDriver",DriverClassName="/Script/OnlineSubsystemUtils.IpNetDriver",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")
+NetDriverDefinitions=(DefName="DemoNetDriver",DriverClassName="/Script/Engine.DemoNetDriver",DriverClassNameFallback="/Script/Engine.DemoNetDriver")

[SocketSubsystemEOS]
; AllowRelays = direct P2P when NAT allows it, EOS relay otherwise (free).
RelayControl=AllowRelays
